<!-- EVEN · tool tokens: the colours only this app needs, one block per look -->
<style id="tool-tokens">

:root[data-theme="glass"]{

     warning #E39A12); income ice blue, expenses lavender, result mint (24.10.: no more salmon/red and saturated green) */
